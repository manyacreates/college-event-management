{% extends "admin/layout.html" %}
{% block title %}Manage Events{% endblock %}

{% block panel %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 fw-bold mb-0">Manage events</h1>
  <button class="btn btn-primary" id="newBtn"><i class="bi bi-plus-lg"></i> New event</button>
</div>

<div class="panel-card" id="eventList"></div>

<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" id="eventForm" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5 fw-bold" id="modalTitle">New event</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger d-none" id="formError"></div>
        <div class="row g-3">
          <div class="col-12"><label class="form-label">Title</label><input class="form-control" id="f_title" required></div>
          <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="f_description" rows="3" required></textarea></div>
          <div class="col-md-6"><label class="form-label">Category</label>
            <select class="form-select" id="f_category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
          <div class="col-md-6"><label class="form-label">Date</label><input type="date" class="form-control" id="f_event_date" required></div>
          <div class="col-md-6"><label class="form-label">Start time</label><input type="time" class="form-control" id="f_start_time" required></div>
          <div class="col-md-6"><label class="form-label">End time</label><input type="time" class="form-control" id="f_end_time" required></div>
          <div class="col-md-8"><label class="form-label">Venue</label><input class="form-control" id="f_venue" required></div>
          <div class="col-md-4"><label class="form-label">Capacity</label><input type="number" min="1" class="form-control" id="f_capacity" required></div>
          <div class="col-12"><label class="form-label">Image URL (optional)</label><input class="form-control" id="f_image_url" placeholder="https://..."></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save event</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const modal = new bootstrap.Modal(document.getElementById("eventModal"));
const form = document.getElementById("eventForm");
const errorBox = document.getElementById("formError");
const fields = ["title", "description", "category", "event_date", "start_time", "end_time", "venue", "capacity", "image_url"];
let events = [];
let editingId = null;

async function loadEvents() {
  const r = await api("/api/events");
  events = r.body.events || [];
  document.getElementById("eventList").innerHTML = events.length
    ? events.map(e => `
      <div class="list-row">
        <a href="/admin/events/${e.id}" class="text-decoration-none text-dark flex-grow-1">
          <strong>${esc(e.title)}</strong>
          <div class="small text-muted">${prettyDate(e.event_date)} &middot; ${esc(e.category)} &middot; ${e.registered_count}/${e.capacity} registered</div>
        </a>
        <div class="d-flex gap-2">
          <a href="/admin/events/${e.id}" class="btn btn-sm btn-outline-primary">Manage</a>
          <button class="btn btn-sm btn-outline-secondary" data-edit="${e.id}">Edit</button>
          <button class="btn btn-sm btn-outline-danger" data-delete="${e.id}">Delete</button>
        </div>
      </div>`).join("")
    : emptyStateHtml("bi-calendar-plus", "No events yet", "Click New event to create the first one.");
}

function openForm(event) {
  editingId = event ? event.id : null;
  document.getElementById("modalTitle").textContent = event ? "Edit event" : "New event";
  errorBox.classList.add("d-none");
  fields.forEach(f => { document.getElementById("f_" + f).value = event ? (event[f] ?? "") : ""; });
  if (!event) document.getElementById("f_category").value = "Technical";
  modal.show();
}

document.getElementById("newBtn").addEventListener("click", () => openForm(null));

document.getElementById("eventList").addEventListener("click", async (e) => {
  const edit = e.target.closest("[data-edit]");
  const del = e.target.closest("[data-delete]");
  if (edit) openForm(events.find(ev => String(ev.id) === edit.dataset.edit));
  if (del) {
    if (!confirm("Delete this event? Registrations and feedback will be deleted too.")) return;
    const r = await api("/api/events/" + del.dataset.delete, "DELETE");
    showToast(r.ok ? "Event deleted." : r.body.message, r.ok ? "success" : "danger");
    loadEvents();
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = {};
  fields.forEach(f => { data[f] = document.getElementById("f_" + f).value.trim(); });
  data.capacity = data.capacity === "" ? null : Number(data.capacity);
  if (!data.image_url) delete data.image_url;

  const r = editingId
    ? await api("/api/events/" + editingId, "PUT", data)
    : await api("/api/events", "POST", data);

  if (!r.ok) {
    errorBox.textContent = r.body.message || "Could not save the event.";
    errorBox.classList.remove("d-none");
    return;
  }
  modal.hide();
  showToast(editingId ? "Event updated." : "Event created.");
  loadEvents();
});

loadEvents();
</script>
{% endblock %}
